services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-rag-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-google}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-huggingface}
      - CHROMA_PERSIST_DIR=/app/backend/chroma_db
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-agentic-rag-assistant}
      - MAX_UPLOAD_SIZE=20971520
      - RETRIEVAL_TOP_K=6
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=50
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8501}
    volumes:
      - chroma_data:/app/backend/chroma_db
      - ./backend/.env:/app/backend/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - agentic-rag-network

  # Frontend Streamlit Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agentic-rag-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/.env:/app/frontend/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - agentic-rag-network

volumes:
  chroma_data:
    driver: local

networks:
  agentic-rag-network:
    driver: bridge
