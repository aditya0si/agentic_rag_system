[project]
name = "agentic-rag-backend"
version = "0.1.0"
description = "Agentic RAG Research Assistant - Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.11.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.3.20",
    "langgraph>=0.4.0",
    "langchain-openai>=0.3.15",
    "langchain-google-genai>=2.1.0",
    "langchain-community>=0.3.20",
    "langchain-huggingface>=0.1.2",
    "chromadb>=1.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "sentence-transformers>=4.0.0",
    "langsmith>=0.3.40",
    "httpx>=0.28.0",
    "structlog>=25.1.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config", "core*", "models*", "routers*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true

# Ignore missing stubs for external packages
[[tool.mypy.overrides]]
module = [
    "langchain*",
    "langgraph*",
    "chromadb*",
    "pdfplumber*",
    "docx*",
    "sentence_transformers*",
    "httpx*",
    "structlog*",
    "tenacity*",
    "pydantic*",
    "fastapi*",
    "uvicorn*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # print statements
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "T201",  # print statements allowed in tests/scripts
]

[tool.ruff.per-file-ignores]
"test_*.py" = ["T201", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["."]
omit = ["test_*.py", "*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
]