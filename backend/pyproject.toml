[project]
name = "agentic-rag-backend"
version = "0.1.0"
description = "Agentic RAG Research Assistant - Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.11.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.3.20",
    "langgraph>=0.4.0",
    "langchain-openai>=0.3.15",
    "langchain-google-genai>=2.1.0",
    "langchain-community>=0.3.20",
    "langchain-huggingface>=0.1.2",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=1.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "sentence-transformers>=4.0.0",
    "langsmith>=0.3.40",
    "httpx>=0.28.0",
    "structlog>=25.1.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config", "core*", "models*", "routers*"]

# NOTE: tool configuration (ruff, mypy, pytest, coverage) lives at the
# repository root - see ../ruff.toml, ../mypy.ini, ../pytest.ini, ../.coveragerc.
# The test/lint jobs run from the repository root so that the backend package and
# the root test suites share one configuration.
