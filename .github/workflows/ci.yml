name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.8.0'

jobs:
  # =============================================================================
  # Code Quality Checks
  # =============================================================================
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff (lint)
        run: |
          cd backend
          ruff check .
          ruff format --check .

      - name: Run MyPy (type check)
        run: |
          cd backend
          mypy .

  # =============================================================================
  # Unit Tests
  # =============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run unit tests
        run: |
          cd backend
          pytest tests/ -v --tb=short -m "unit" --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: unit
          name: unit-tests

  # =============================================================================
  # Integration Tests
  # =============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Start ChromaDB
        run: |
          docker run -d --name chromadb -p 8000:8000 chromadb/chroma:latest
          sleep 5

      - name: Run integration tests
        env:
          CHROMA_HOST: localhost
          CHROMA_PORT: 8000
          LLM_PROVIDER: google
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          cd backend
          pytest tests/ -v --tb=short -m "integration" --cov=. --cov-report=xml --cov-report=term-missing || true

      - name: Cleanup ChromaDB
        if: always()
        run: docker stop chromadb && docker rm chromadb

  # =============================================================================
  # Build Docker Image
  # =============================================================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-format, unit-tests]
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: agentic-rag-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: agentic-rag-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test Docker images
        run: |
          # Test backend starts
          docker run -d --name test-backend -p 8000:8000 \
            -e LLM_PROVIDER=google \
            -e GOOGLE_API_KEY=test \
            agentic-rag-backend:${{ github.sha }}
          sleep 10
          curl -f http://localhost:8000/health
          docker stop test-backend && docker rm test-backend

  # =============================================================================
  # Deploy to Staging (on push to develop)
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hugging Face Spaces
        uses: docker/login-action@v3
        with:
          registry: hf.co
          username: ${{ secrets.HF_USERNAME }}
          password: ${{ secrets.HF_TOKEN }}

      - name: Push images to HF Spaces
        run: |
          docker tag agentic-rag-backend:${{ github.sha }} hf.co/${{ secrets.HF_USERNAME }}/agentic-rag-backend:staging
          docker tag agentic-rag-frontend:${{ github.sha }} hf.co/${{ secrets.HF_USERNAME }}/agentic-rag-frontend:staging
          docker push hf.co/${{ secrets.HF_USERNAME }}/agentic-rag-backend:staging
          docker push hf.co/${{ secrets.HF_USERNAME }}/agentic-rag-frontend:staging

  # =============================================================================
  # Deploy to Production (on push to main)
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hugging Face Spaces
        uses: docker/login-action@v3
        with:
          registry: hf.co
          username: ${{ secrets.HF_USERNAME }}
          password: ${{ secrets.HF_TOKEN }}

      - name: Push images to HF Spaces
        run: |
          docker tag agentic-rag-backend:${{ github.sha }} hf.co/${{ secrets.HF_USERNAME }}/agentic-rag-backend:latest
          docker tag agentic-rag-frontend:${{ github.sha }} hf.co/${{ secrets.HF_USERNAME }}/agentic-rag-frontend:latest
          docker push hf.co/${{ secrets.HF_USERNAME }}/agentic-rag-backend:latest
          docker push hf.co/${{ secrets.HF_USERNAME }}/agentic-rag-frontend:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true