; mypy configuration for the whole repository.
; CI runs: mypy backend tests conftest.py   (from the repository root)
;
; Scope note: the Streamlit frontend, the eval/ scripts and the standalone
; utility scripts at the repository root are not type-checked here - they are
; not part of the backend package that CI builds and ships.
[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_optional = True
show_error_codes = True
pretty = True

; Legacy ad-hoc scripts kept at the backend root. They are not part of the
; pytest suite (see testpaths in pytest.ini) and need a live LLM provider plus
; reportlab (not a project dependency), so they cannot be type-checked or run in
; CI. The maintained equivalents live in backend/tests/ and tests/.
exclude = (^backend/test_agentic_rag\.py$|^backend/test_basic_rag\.py$|^backend/test_endpoints\.py$|^backend/test_hallucination\.py$|^backend/test_ingestion\.py$)

; Ignore missing stubs for external packages
[mypy-langgraph,langgraph.*,chromadb,chromadb.*,pdfplumber,pdfplumber.*,docx,docx.*,sentence_transformers,sentence_transformers.*,httpx,httpx.*,structlog,structlog.*,tenacity,tenacity.*,pydantic,pydantic.*,fastapi,fastapi.*]
ignore_missing_imports = True

; Tests assert on dynamic library internals; they are checked for consistency,
; not for full annotation coverage.
[mypy-backend.tests.*,tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
