[pytest]
# Single source of truth for test discovery, import path and markers.
# CI runs these exact selections (see .github/workflows/ci.yml):
#   unit job:        pytest -m unit
#   integration job: pytest -m "integration and not llm"
testpaths = backend/tests tests
pythonpath = .
addopts = -v --tb=short --strict-markers

markers =
    unit: fast, deterministic test; no network, no model downloads, no external services
    integration: exercises real local infrastructure (ChromaDB persistence, embedding/reranker model downloads)
    llm: calls a hosted LLM provider and therefore needs API credentials (GOOGLE_API_KEY / OPENAI_API_KEY)
    regression: golden-dataset regression check of the RAG pipeline
